/* ─── AUTOCOMPLETE INPUT ─── */
function AutoInput({ value, onChange, placeholder, suggestions, style }) {
  const [show, setShow] = useState(false);
  const [filtered, setFiltered] = useState([]);

  const handleChange = (val) => {
    onChange(val);
    if (val.trim().length > 0) {
      const f = suggestions.filter(s => s.toLowerCase().includes(val.toLowerCase()));
      setFiltered(f);
      setShow(f.length > 0);
    } else {
      setShow(false);
    }
  };

  const select = (s) => { onChange(s); setShow(false); };

  return (
    <div style={{ position:"relative" }}>
      <input
        value={value}
        placeholder={placeholder}
        onChange={e=>handleChange(e.target.value)}
        onBlur={()=>setTimeout(()=>setShow(false), 150)}
        onFocus={()=>{ if(value.trim().length>0 && filtered.length>0) setShow(true); }}
        style={style||S.input}
      />
      {show && (
        <div style={{ position:"absolute", top:"100%", left:0, right:0, background:T.surface, border:`1px solid ${T.border}`, borderRadius:10, zIndex:999, overflow:"hidden", marginTop:4, boxShadow:"0 8px 24px rgba(0,0,0,0.1)" }}>
          {filtered.slice(0,5).map((s,i)=>(
            <div key={i} onMouseDown={()=>select(s)} onClick={()=>select(s)}
              style={{ padding:"12px 16px", fontSize:14, cursor:"pointer", borderBottom:`1px solid ${T.border}`, color:T.text }}>
              👤 {s}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

];

const EMPTY = { income:[], expenses:[], mileage:[], timelog:[], documents:[], mortgages:[], cards:[], contacts:[], estimates:[], tasks:SAMPLE_TASKS, customExpenseCats:[] };

function loadData() {
  for (const key of [STORAGE_KEY, ...OLD_KEYS]) {
    try {
      const r = localStorage.getItem(key);
      if (r) {
        const parsed = JSON.parse(r);
        const d = { ...EMPTY, ...parsed };
        if (!d.tasks || d.tasks.length === 0) d.tasks = SAMPLE_TASKS;
        if (key !== STORAGE_KEY) localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
        return d;
      }
    } catch {}
  }
  return { ...EMPTY };
}
function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }

async function fetchSheets() {
  const res = await fetch(GAS_URL + "?action=getAll");
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}
async function saveSheet(sheet, records) {
  const data = sheet === "documents" ? records.map(({fileData,...r})=>r) : records;
  const encoded = encodeURIComponent(JSON.stringify(data));
  const res = await fetch(`${GAS_URL}?action=save&sheet=${sheet}&data=${encoded}`);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

            </div>
          </div>
        </div>
      )}

      <main style={{ padding:"16px 16px 0" }}>
        {tab==="Dashboard" && <DashboardTab fi={fi} totalIn={totalIn} totalEx={totalEx} netProfit={netProfit} totalMi={totalMi} miDeduct={miDeduct} totalHr={totalHr} month={month} data={data} update={update} />}
        {tab==="Income"    && <IncomeTab    records={data.income||[]}    onUpdate={v=>update("income",v)}    cards={data.cards||[]} docs={data.documents||[]} />}
        {tab==="Expenses"  && <ExpensesTab  records={data.expenses||[]}  onUpdate={v=>update("expenses",v)}  cards={data.cards||[]} docs={data.documents||[]} customCats={data.customExpenseCats||[]} />}
        {tab==="Mileage"   && <MileageTab   records={data.mileage||[]}   onUpdate={v=>update("mileage",v)}   totalMi={totalMi} miDeduct={miDeduct} />}
        {tab==="Time Log"  && <TimeLogTab   records={data.timelog||[]}   onUpdate={v=>update("timelog",v)}   totalHr={totalHr} />}
        {tab==="Mortgage"  && <MortgageTab  records={data.mortgages||[]} onUpdate={v=>update("mortgages",v)} />}
        {tab==="Documents" && <DocumentsTab records={data.documents||[]} onUpdate={v=>update("documents",v)} />}
        {tab==="Contacts"  && <ContactsTab  contacts={data.contacts||[]} onUpdate={v=>update("contacts",v)} estimates={data.estimates||[]} onUpdateEst={v=>update("estimates",v)} />}
        {tab==="Tasks"     && <TasksTab     tasks={data.tasks||[]} onUpdate={v=>update("tasks",v)} />}
        {tab==="Reports"   && <ReportsTab   fi={fi} month={month} totalIn={totalIn} totalEx={totalEx} netProfit={netProfit} totalMi={totalMi} miDeduct={miDeduct} totalHr={totalHr} />}
        {tab==="Cards"     && <CardsTab     cards={data.cards||[]} onUpdate={v=>update("cards",v)} expenses={data.expenses||[]} month={month} />}
        {tab==="Settings"  && <SettingsTab  customCats={data.customExpenseCats||[]} onUpdate={v=>update("customExpenseCats",v)} />}
      </main>

      <nav style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:480, background:T.surface, borderTop:`1px solid ${T.border}`, display:"flex", zIndex:100, paddingBottom:"env(safe-area-inset-bottom)" }}>
        {NAV.map(n=>{
          const active = tab===n.id||(n.id==="More"&&MORE_ITEMS.includes(tab));
          return (
            <button key={n.id} onClick={()=>n.id==="More"?setShowMore(v=>!v):goTab(n.id)}
              style={{ flex:1, background:"none", border:"none", color:active?T.accent:T.text3, fontFamily:"inherit", fontSize:10, fontWeight:600, padding:"12px 0 10px", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
              <Icon icon={n.icon} size={22} color={active?T.accent:T.text3} />
              <span style={{ fontSize:10, letterSpacing:"-0.1px" }}>{n.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

/* ════════════════════════════════════════
   DASHBOARD
════════════════════════════════════════ */
function DashboardTab({ fi, totalIn, totalEx, netProfit, totalMi, miDeduct, totalHr, month, data, update }) {
  const [modal, setModal] = useState(null);
  const [notif, setNotif] = useState(typeof Notification !== "undefined" && Notification?.permission==="granted");
  const PC = { High:"#f87171", Medium:"#fbbf24", Low:"#6b7280" };

  useEffect(() => {
    if (typeof Notification !== "undefined" && Notification?.permission==="granted") checkDue(data.tasks||[]);
  }, []);

  const checkDue = (tasks) => {
    if (typeof Notification === "undefined") return;
    const now = new Date(); now.setHours(0,0,0,0);
    const tmr = new Date(now); tmr.setDate(now.getDate()+1);
    tasks.filter(t=>!t.done&&t.dueDate).forEach(t=>{
      const d = new Date(t.dueDate+"T00:00:00");
      if (d.getTime()===now.getTime()) new Notification(`⚠️ 오늘 마감: ${t.title}`,{body:t.project||""});
      else if (d.getTime()===tmr.getTime()) new Notification(`📅 내일 마감: ${t.title}`,{body:t.project||""});
      else if (d < now) new Notification(`🚨 마감 지남: ${t.title}`,{body:fmtDate(t.dueDate)});
    });
  };

  const requestNotif = async () => {
    if (typeof Notification === "undefined") { alert("이 브라우저는 알림을 지원하지 않아요."); return; }
    const p = await Notification.requestPermission();
    if (p==="granted") { setNotif(true); checkDue(data.tasks||[]); new Notification("BizTracker 알림 ON ✅",{body:"마감일을 알려드릴게요"}); }
  };

  const toggleTask = (id) => update("tasks", (data.tasks||[]).map(t=>t.id===id?{...t,done:!t.done}:t));

  const today0 = new Date(); today0.setHours(0,0,0,0);
  const tomorrow = new Date(today0); tomorrow.setDate(today0.getDate()+1);

  const getUrgency = (t) => {
    if (!t.dueDate) return 99;
    const d = new Date(t.dueDate+"T00:00:00");
    if (d < today0) return 0;                          // 마감 지남 🚨
    if (d.getTime() === today0.getTime()) return 1;    // 오늘 마감 ⚠️
    if (d.getTime() === tomorrow.getTime()) return 2;  // 내일 마감
    const daysLeft = Math.ceil((d-today0)/(1000*60*60*24));
    return daysLeft + 2;
  };

  const pending = (data.tasks||[]).filter(t=>!t.done).sort((a,b)=>{
    const urgA = getUrgency(a), urgB = getUrgency(b);
    if (urgA !== urgB) return urgA - urgB;
    const p = {High:0,Medium:1,Low:2};
    return (p[a.priority]||1)-(p[b.priority]||1);
  });

  const overdue  = pending.filter(t=>t.dueDate && new Date(t.dueDate+"T00:00:00")<today0);
  const dueToday = pending.filter(t=>t.dueDate && new Date(t.dueDate+"T00:00:00").getTime()===today0.getTime());
  const totalDone = (data.tasks||[]).filter(t=>t.done).length;
  const totalPct  = (data.tasks||[]).length ? Math.round(totalDone/(data.tasks||[]).length*100) : 0;
  const allProjects = [...new Set((data.tasks||[]).map(t=>t.project).filter(Boolean))];
  const projects = allProjects.map(proj => {
    const pts = (data.tasks||[]).filter(t=>t.project===proj);
    const done = pts.filter(t=>t.done).length;
    return { name:proj, total:pts.length, done, pct:pts.length?Math.round(done/pts.length*100):0 };
  });

  const STATS = [
    { key:"income",   icon:TrendingUp,   label:"Income",    val:fmt$(totalIn),               color:T.green,  bg:"#ECFDF5" },
    { key:"expense",  icon:TrendingDown, label:"Expenses",  val:fmt$(totalEx),               color:T.red,    bg:"#FEF2F2" },
    { key:"mileage",  icon:Car,          label:"Mileage",   val:`${totalMi.toFixed(0)} mi`,  color:T.accent, bg:"#EFF6FF", sub:fmt$(miDeduct)+" deduction" },
    { key:"timelog",  icon:Clock,        label:"Hours",     val:`${totalHr.toFixed(1)}h`,    color:T.teal,   bg:"#F0FDFA" },
    { key:null,       icon:BarChart2,    label:"Net Profit",val:fmt$(netProfit),             color:netProfit>=0?T.green:T.red, bg:netProfit>=0?"#ECFDF5":"#FEF2F2" },
    { key:"document", icon:FileArchive,  label:"Documents", val:(data.documents||[]).length, color:T.purple, bg:"#F5F3FF" },
  ];

  const openModal = (type, record=null) => setModal(record ? {type, record} : type);

  const [taskView, setTaskView] = useState("todo"); // todo | tasks

  return (
    <div>
      {/* TASKS HEADER */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <div style={{ display:"flex", gap:2, background:"#F3F4F6", borderRadius:12, padding:4 }}>
          <button onClick={()=>setTaskView("todo")}
            style={{ background:taskView==="todo"?T.surface:"transparent", color:taskView==="todo"?T.text:T.text3, border:"none", borderRadius:9, padding:"7px 16px", fontSize:13, fontWeight:600, cursor:"pointer", fontFamily:"inherit", boxShadow:taskView==="todo"?"0 1px 4px rgba(0,0,0,0.08)":"none", display:"flex", alignItems:"center", gap:6 }}>
            <Icon icon="CheckCircle2" size={14} color={taskView==="todo"?T.accent:T.text3} /> Todo
          </button>
          <button onClick={()=>setTaskView("tasks")}
            style={{ background:taskView==="tasks"?T.surface:"transparent", color:taskView==="tasks"?T.text:T.text3, border:"none", borderRadius:9, padding:"7px 16px", fontSize:13, fontWeight:600, cursor:"pointer", fontFamily:"inherit", boxShadow:taskView==="tasks"?"0 1px 4px rgba(0,0,0,0.08)":"none", display:"flex", alignItems:"center", gap:6 }}>
            <Icon icon="BarChart2" size={14} color={taskView==="tasks"?T.accent:T.text3} /> Progress
          </button>
        </div>
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          {!notif
            ? <button onClick={requestNotif} style={{ ...S.btnGhost, padding:"7px 12px", color:T.amber, display:"flex", alignItems:"center", gap:5, fontSize:12 }}><Icon icon="AlertCircle" size={14} color={T.amber} /> Alerts</button>
            : <span style={{ fontSize:12, color:T.green, fontWeight:600, display:"flex", alignItems:"center", gap:4 }}><Icon icon="CheckCircle2" size={13} color={T.green} /> On</span>}
          <button onClick={()=>openModal("task")} style={{ ...S.btn, padding:"8px 14px", fontSize:13, display:"flex", alignItems:"center", gap:5 }}><Icon icon="Plus" size={15} color="#fff" /> Add</button>
        </div>
      </div>

      {/* TODO VIEW */}
      {taskView==="todo" && (
        <div style={{ marginBottom:8 }}>
          {overdue.length>0 && (
            <div style={{ background:"#FEF2F2", border:"1px solid #FECACA", borderRadius:12, padding:"12px 16px", marginBottom:10, display:"flex", gap:10, alignItems:"flex-start" }}>
              <Icon icon="AlertCircle" size={16} color={T.red} style={{ marginTop:1, flexShrink:0 }} />
              <div>
                <div style={{ color:T.red, fontWeight:700, fontSize:13 }}>마감 지난 항목 {overdue.length}개</div>
                <div style={{ fontSize:11, color:T.red, marginTop:2, opacity:0.8 }}>{overdue.map(t=>t.title).join(", ")}</div>
              </div>
            </div>
          )}
          {dueToday.length>0 && (
            <div style={{ background:"#FFFBEB", border:"1px solid #FDE68A", borderRadius:12, padding:"12px 16px", marginBottom:10, display:"flex", gap:10, alignItems:"flex-start" }}>
              <Icon icon="AlertTriangle" size={16} color={T.amber} style={{ marginTop:1, flexShrink:0 }} />
              <div>
                <div style={{ color:T.amber, fontWeight:700, fontSize:13 }}>오늘 마감 {dueToday.length}개</div>
                <div style={{ fontSize:11, color:T.amber, marginTop:2, opacity:0.8 }}>{dueToday.map(t=>t.title).join(", ")}</div>
              </div>
            </div>
          )}
          {pending.slice(0,5).map(t=>{
            const d = t.dueDate ? new Date(t.dueDate+"T00:00:00") : null;
            const od = d && d<today0, td = d && d.getTime()===today0.getTime();
            const PC = { High:T.red, Medium:T.amber, Low:T.text3 };
            return (
              <div key={t.id} style={{ ...S.card, marginBottom:8, padding:"14px 16px", display:"flex", alignItems:"center", gap:12, borderLeft:`3px solid ${od?T.red:td?T.amber:PC[t.priority]||T.text3}` }}>
                <div onClick={()=>toggleTask(t.id)} style={{ cursor:"pointer", flexShrink:0 }}>
                  <Icon icon="Circle" size={22} color={PC[t.priority]||T.text3} />
                </div>
                <div onClick={()=>openModal({type:"editTask", record:t})} style={{ flex:1, minWidth:0, cursor:"pointer" }}>
                  <div style={{ fontSize:14, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", color:T.text }}>{t.title}</div>
                  <div style={{ fontSize:12, color:T.text3, marginTop:3, display:"flex", gap:6, flexWrap:"wrap", alignItems:"center" }}>
                    {t.project && <Badge color={T.accent}>{t.project}</Badge>}
                    {d && <span style={{ color:od?T.red:td?T.amber:T.text3, display:"flex", alignItems:"center", gap:3 }}>
                      <Icon icon={od?"AlertCircle":td?"AlertTriangle":"Calendar"} size={11} color={od?T.red:td?T.amber:T.text3} />
                      {fmtDate(t.dueDate)}
                    </span>}
                  </div>
                </div>
                <Badge color={PC[t.priority]||T.text3} small>{t.priority}</Badge>
              </div>
            );
          })}
          {pending.length===0 && <div style={{ ...S.card, textAlign:"center", padding:"20px 0", marginBottom:8, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}><Icon icon="CheckCircle2" size={18} color={T.green} /><span style={{ color:T.green, fontWeight:600, fontSize:14 }}>모든 할일 완료!</span></div>}
          {pending.length>5 && <div style={{ fontSize:12, color:T.text3, textAlign:"center", marginBottom:8 }}>+{pending.length-5}개 더</div>}
        </div>
      )}

      {/* TASKS VIEW — 공정율 */}
      {taskView==="tasks" && (
        <div style={{ marginBottom:8 }}>
          {/* Overall */}
          <div style={{ ...S.card, marginBottom:12 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
              <div style={{ fontSize:14, fontWeight:700, color:T.text }}>전체 진행률</div>
              <div style={{ fontSize:24, fontWeight:800, color:T.accent, ...S.mono }}>{totalPct}%</div>
            </div>
            <div style={{ height:8, background:"#F3F4F6", borderRadius:8, overflow:"hidden", marginBottom:6 }}>
              <div style={{ width:`${totalPct}%`, height:"100%", background:`linear-gradient(90deg,${T.accent},${T.teal})`, borderRadius:8, transition:"width 0.5s ease" }} />
            </div>
            <div style={{ fontSize:12, color:T.text3 }}>{totalDone}/{(data.tasks||[]).length} 완료</div>
          </div>
          {/* By project */}
          {projects.length>0 && (
            <div style={S.card}>
              <div style={S.section}>프로젝트별 공정률 · 탭해서 상세보기 👉</div>
              {projects.map(p=>(
                <div key={p.name} onClick={()=>{ openModal({type:"projectDetail", project:p.name}); }} style={{ marginBottom:14, cursor:"pointer" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:T.text }}>{p.name}</div>
                    <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                      <span style={{ fontSize:11, color:T.text3 }}>{p.done}/{p.total}</span>
                      <span style={{ fontSize:14, fontWeight:800, color:p.pct===100?T.green:p.pct>=50?T.amber:T.red, ...S.mono }}>{p.pct}%</span>
                      <span style={{ color:T.text3, fontSize:14 }}>›</span>
                    </div>
                  </div>
                  <div style={{ height:7, background:T.border, borderRadius:4, overflow:"hidden" }}>
                    <div style={{ width:`${p.pct}%`, height:"100%", background:p.pct===100?T.green:p.pct>=50?T.amber:T.red, borderRadius:4 }} />
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* STATS */}
      <div style={{ fontSize:12, color:T.text3, marginBottom:10, marginTop:8 }}>탭해서 바로 추가 👇</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:20 }}>
        {STATS.map((a,i)=>(
          <div key={i} onClick={()=>a.key&&openModal(a.key)}
            style={{ background:a.bg||T.surface, borderRadius:16, padding:"16px 14px", cursor:a.key?"pointer":"default", position:"relative", boxShadow:"0 1px 3px rgba(0,0,0,0.05)" }}>
            {a.key && <div style={{ position:"absolute", top:10, right:12, background:a.color+"22", color:a.color, borderRadius:20, padding:"2px 8px", fontSize:10, fontWeight:700 }}>+ Add</div>}
            <div style={{ width:34, height:34, background:a.color+"18", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", marginBottom:10 }}>
              <Icon icon={a.icon} size={18} color={a.color} />
            </div>
            <div style={{ fontSize:22, fontWeight:800, color:a.color, letterSpacing:"-0.8px", lineHeight:1 }}>{a.val}</div>
            <div style={{ fontSize:12, fontWeight:600, marginTop:4, color:T.text2 }}>{a.label}</div>
            {a.sub && <div style={{ fontSize:10, color:a.color, marginTop:2, fontWeight:500 }}>{a.sub}</div>}
          </div>
        ))}
      </div>

      {/* RECENT EXPENSES */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
        <div style={S.section}>Recent Expenses</div>
        <div style={{ fontSize:11, color:"#4b5563" }}>탭해서 수정 ✏️</div>
      </div>
      {/* RECENT EXPENSES */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12, marginTop:8 }}>
        <div style={{ fontSize:16, fontWeight:700, color:T.text }}>Recent Expenses</div>
        <span style={{ fontSize:12, color:T.text3, display:"flex", alignItems:"center", gap:4 }}><Icon icon="Edit3" size={12} color={T.text3} /> tap to edit</span>
      </div>
      <div style={{ ...S.card, padding:0, overflow:"hidden" }}>
        {fi.expenses.length===0 && <div style={{ padding:24, textAlign:"center", color:T.text3, fontSize:14 }}>No expenses this month</div>}
        {fi.expenses.slice(-5).reverse().map((r,i,arr)=>(
          <div key={r.id} onClick={()=>openModal("editExpense", r)}
            style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 18px", cursor:"pointer", borderBottom: i<arr.length-1?`1px solid ${T.border}`:"none" }}>
            <div style={{ width:42, height:42, borderRadius:12, background:getTax(r.category,data.customExpenseCats||[])==="E"?"#FEF3C7":"#EFF6FF", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
              <Icon icon={getTax(r.category,data.customExpenseCats||[])==="E"?"Building2":"DollarSign"} size={20} color={getTax(r.category,data.customExpenseCats||[])==="E"?T.amber:T.accent} />
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:14, fontWeight:600, color:T.text, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{r.description||r.category}</div>
              <div style={{ fontSize:12, color:T.text3, marginTop:2 }}>{fmtDate(r.date)} · <span style={{ color:getTax(r.category,data.customExpenseCats||[])==="E"?T.amber:T.teal, fontWeight:600 }}>Sch {getTax(r.category,data.customExpenseCats||[])}</span></div>
            </div>
            <div style={{ fontSize:15, fontWeight:700, color:T.red, letterSpacing:"-0.3px", flexShrink:0 }}>-{fmt$(parseFloat(r.amount))}</div>
          </div>
        ))}
      </div>

      {/* MODAL */}
      {modal && (
        <div onClick={()=>setModal(null)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.4)", zIndex:500, display:"flex", alignItems:"flex-end", justifyContent:"center", backdropFilter:"blur(4px)" }}>
          <div onClick={e=>e.stopPropagation()} style={{ background:T.surface, borderRadius:"24px 24px 0 0", width:"100%", maxWidth:480, maxHeight:"90vh", overflow:"auto", paddingBottom:32, boxShadow:"0 -8px 40px rgba(0,0,0,0.12)" }}>
            <div style={{ width:36, height:4, background:"#E5E7EB", borderRadius:2, margin:"14px auto 20px" }} />
            {modal==="income"   && <QIncome  onDone={(r)=>{update("income",[...data.income,r]);setModal(null);}} cards={data.cards||[]} contacts={data.contacts||[]} />}
            {modal==="expense"  && <QExpense onDone={(r)=>{update("expenses",[...data.expenses,r]);setModal(null);}} cards={data.cards||[]} contacts={data.contacts||[]} customCats={data.customExpenseCats||[]} />}
            {modal==="mileage"  && <QMileage onDone={(r)=>{update("mileage",[...data.mileage,r]);setModal(null);}} contacts={data.contacts||[]} />}
            {modal==="timelog"  && <QTimelog onDone={(r)=>{update("timelog",[...data.timelog,r]);setModal(null);}} contacts={data.contacts||[]} />}
            {modal==="task"     && <QTask    onDone={(r)=>{update("tasks",[...(data.tasks||[]),r]);setModal(null);}} contacts={data.contacts||[]} />}
            {modal==="document" && <QDocument onDone={(r)=>{update("documents",[...data.documents,r]);setModal(null);}} />}
            {modal?.type==="editTask" && (
              <QTask
                initial={modal.record}
                onDone={(r)=>{update("tasks",(data.tasks||[]).map(t=>t.id===r.id?r:t));setModal(null);}}
                onDelete={()=>{if(confirm("삭제할까요?")){update("tasks",(data.tasks||[]).filter(t=>t.id!==modal.record.id));setModal(null);}}}
                contacts={data.contacts||[]}
              />
            )}
            {modal?.type==="projectDetail" && (
              <ProjectDetail
                project={modal.project}
                tasks={data.tasks||[]}
                onUpdate={v=>update("tasks",v)}
                onClose={()=>setModal(null)}
                contacts={data.contacts||[]}
              />
            )}
            {modal?.type==="editExpense" && (
              <QExpense
                initial={modal.record}
                onDone={(r)=>{update("expenses",data.expenses.map(e=>e.id===r.id?r:e));setModal(null);}}
                onDelete={()=>{if(confirm("삭제할까요?")){update("expenses",data.expenses.filter(e=>e.id!==modal.record.id));setModal(null);}}}
                cards={data.cards||[]}
                contacts={data.contacts||[]}
                customCats={data.customExpenseCats||[]}
              />
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════
   QUICK FORMS
════════════════════════════════════════ */
function QIncome({ onDone, cards, contacts }) {
  const [f,setF] = useState({ date:todayStr(), category:INCOME_CATS[0], description:"", amount:"", cardId:"" });
  const names = (contacts||[]).map(c=>c.name);
  return (
    <div style={{ padding:"0 16px" }}>
      <div style={{ fontSize:16, fontWeight:800, marginBottom:16 }}>💰 Add Income</div>
      <Field label="Amount ($)"><input type="number" autoFocus placeholder="0.00" value={f.amount} onChange={e=>setF({...f,amount:e.target.value})} style={S.input} /></Field>
      <Field label="Category"><select value={f.category} onChange={e=>setF({...f,category:e.target.value})} style={S.input}>{INCOME_CATS.map(c=><option key={c}>{c}</option>)}</select></Field>

function ProjectDetail({ project, tasks, onUpdate, onClose }) {
  const [editTask, setEditTask] = useState(null);
  const PC = { High:"#f87171", Medium:"#fbbf24", Low:"#6b7280" };
  const projectTasks = tasks.filter(t=>t.project===project).sort((a,b)=>{
    if (a.done!==b.done) return a.done?1:-1;
    const p={High:0,Medium:1,Low:2}; return (p[a.priority]||1)-(p[b.priority]||1);
  });
  const done = projectTasks.filter(t=>t.done).length;
  const pct  = projectTasks.length ? Math.round(done/projectTasks.length*100) : 0;
  const today0 = new Date(); today0.setHours(0,0,0,0);

  const toggle = (id) => onUpdate(tasks.map(t=>t.id===id?{...t,done:!t.done}:t));
  const save   = (r)  => { onUpdate(tasks.map(t=>t.id===r.id?r:t)); setEditTask(null); };
  const del    = (id) => { if(confirm("삭제할까요?")) onUpdate(tasks.filter(t=>t.id!==id)); setEditTask(null); };

  if (editTask) return (
    <div style={{ padding:"0 16px" }}>
      <button onClick={()=>setEditTask(null)} style={{ ...S.btnGhost, padding:"8px 12px", marginBottom:16 }}>← Back</button>
      <QTask initial={editTask} onDone={save} onDelete={()=>del(editTask.id)} />
    </div>
  );

  return (
    <div style={{ padding:"0 16px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:16 }}>
        <button onClick={onClose} style={{ ...S.btnGhost, padding:"8px 12px" }}>← Back</button>
        <div style={{ fontSize:16, fontWeight:800, flex:1 }}>{project}</div>
        <span style={{ fontSize:20, fontWeight:800, color:pct===100?"#6ee7b7":pct>=50?"#fbbf24":"#f87171", ...S.mono }}>{pct}%</span>
      </div>

      {/* Progress bar */}
      <div style={{ background:"#1e2130", borderRadius:8, overflow:"hidden", marginBottom:6, height:10 }}>
        <div style={{ width:`${pct}%`, height:"100%", background:pct===100?"#6ee7b7":pct>=50?"#fbbf24":"#f87171", borderRadius:8, transition:"width 0.4s" }} />
      </div>
      <div style={{ fontSize:12, color:"#6b7280", marginBottom:16 }}>{done}/{projectTasks.length} 완료</div>

      {/* Task list */}
      {projectTasks.length===0 && <div style={{ textAlign:"center", color:"#4b5563", padding:"20px 0" }}>이 프로젝트에 할일이 없어요</div>}
      {projectTasks.map(t=>{
        const d   = t.dueDate ? new Date(t.dueDate+"T00:00:00") : null;
        const od  = d && d<today0;
        const td  = d && d.getTime()===today0.getTime();
        return (
          <div key={t.id} style={{ ...S.card, marginBottom:8, padding:"12px 16px", display:"flex", alignItems:"center", gap:12,
            borderLeft:`3px solid ${t.done?"#2a2d3a":od?"#f87171":td?"#fbbf24":PC[t.priority]||"#6b7280"}`, opacity:t.done?0.55:1 }}>
            {/* 체크박스 */}
            <div onClick={()=>toggle(t.id)}
              style={{ width:24, height:24, borderRadius:"50%", border:`2px solid ${t.done?"#6ee7b7":PC[t.priority]||"#6b7280"}`, background:t.done?"#6ee7b7":"transparent", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", flexShrink:0 }}>
              {t.done && <span style={{ fontSize:12, color:"#0f1117", fontWeight:800 }}>✓</span>}
            </div>
            {/* 내용 탭 → 수정 */}
            <div onClick={()=>setEditTask(t)} style={{ flex:1, minWidth:0, cursor:"pointer" }}>
              <div style={{ fontSize:13, fontWeight:600, textDecoration:t.done?"line-through":"none", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{t.title}</div>
              <div style={{ fontSize:11, color:"#4b5563", marginTop:3, display:"flex", gap:6, flexWrap:"wrap" }}>
                {t.dueDate && <span style={{ color:t.done?"#4b5563":od?"#f87171":td?"#fbbf24":"#6b7280" }}>{od?"🚨":td?"⚠️":"📅"} {fmtDate(t.dueDate)}</span>}
                {t.notes && <span>💬 {t.notes}</span>}
              </div>
            </div>
            <Badge color={t.done?"#2a2d3a":PC[t.priority]||"#6b7280"}>{t.done?"Done":t.priority}</Badge>
          </div>
        );
      })}
    </div>
  );
}

/* ════════════════════════════════════════
   MORTGAGE TAB
════════════════════════════════════════ */
function MortgageTab({ records, onUpdate }) {
  const [loans,setLoans]     = useState(()=>records.filter(r=>r.type==="loan"));
  const [payments,setPayments]= useState(()=>records.filter(r=>r.type==="payment"));
  const [addingLoan,setAddingLoan] = useState(false);
  const [sel,setSel]         = useState(null);
  const [lf,setLf]           = useState({ name:"", propertyAddress:"", principal:"", rate:"", termYears:"30", startDate:todayStr() });
  const [pf,setPf]           = useState({ date:todayStr(), totalPayment:"", principal:"", interest:"", escrow:"" });

  useEffect(()=>{ onUpdate([...loans,...payments]); },[loans,payments]);

  const mp = (l) => { const r=parseFloat(l?.rate)/100/12,n=parseFloat(l?.termYears)*12,p=parseFloat(l?.principal); if(!r||!n||!p)return 0; return (p*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1); };
  const calcSplit = (loan,date,total) => {
    if(!loan||!total)return{p:"",i:""};
    const r=parseFloat(loan.rate)/100/12,n=parseFloat(loan.termYears)*12,p=parseFloat(loan.principal);
    if(!r||!n||!p)return{p:"",i:""};
    const months=Math.max(0,Math.round((new Date(date)-new Date(loan.startDate))/(1000*60*60*24*30.44)));
    const mpv=(p*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);
    let bal=p; for(let i=0;i<months;i++) bal=bal-(mpv-bal*r); bal=Math.max(0,bal);
    const interest=+(bal*r).toFixed(2); const principal=+(Math.max(0,parseFloat(total)-interest)).toFixed(2);
    return{p:principal.toFixed(2),i:interest.toFixed(2)};
  };

  const loan=loans.find(l=>l.id===sel);
  const lp=payments.filter(p=>p.loanId===sel);
  const totalInt=lp.reduce((s,p)=>s+(parseFloat(p.interest)||0),0);
  const totalPri=lp.reduce((s,p)=>s+(parseFloat(p.principal)||0),0);
  const balance=loan?Math.max(0,parseFloat(loan.principal)-totalPri):0;
  const yearInt=lp.filter(p=>p.date?.startsWith(String(new Date().getFullYear()))).reduce((s,p)=>s+(parseFloat(p.interest)||0),0);

  return (
    <div>
      <div style={{ fontSize:18, fontWeight:800, marginBottom:16 }}>🏦 Mortgage</div>
      <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:16 }}>
        {loans.map(l=>(
          <button key={l.id} onClick={()=>setSel(l.id)} style={{ ...S.btnGhost, flex:1, minWidth:130, textAlign:"left", background:sel===l.id?"#1a2a1f":"#16181f", border:`1px solid ${sel===l.id?"#6ee7b7":"#2a2d3a"}`, color:sel===l.id?"#6ee7b7":"#9ca3af" }}>
            <div style={{ fontWeight:700, fontSize:13 }}>{l.name}</div>
            <div style={{ fontSize:11, color:"#6b7280", marginTop:2 }}>{fmt$(mp(l))}/mo</div>
          </button>
        ))}
        <button onClick={()=>setAddingLoan(true)} style={{ ...S.btnGhost, flex:1, minWidth:100 }}>+ Add Loan</button>
      </div>
      {addingLoan && (
        <div style={S.card}>
          <div style={S.section}>NEW LOAN</div>
          <Field label="Name"><input placeholder="Cabin Mortgage" value={lf.name} onChange={e=>setLf({...lf,name:e.target.value})} style={S.input} /></Field>
          <Field label="Property"><input placeholder="Address" value={lf.propertyAddress} onChange={e=>setLf({...lf,propertyAddress:e.target.value})} style={S.input} /></Field>
          <Field label="Loan Amount ($)"><input type="number" placeholder="250000" value={lf.principal} onChange={e=>setLf({...lf,principal:e.target.value})} style={S.input} /></Field>
          <Field label="Interest Rate (%)"><input type="number" step="0.01" placeholder="6.75" value={lf.rate} onChange={e=>setLf({...lf,rate:e.target.value})} style={S.input} /></Field>
          <Field label="Term"><select value={lf.termYears} onChange={e=>setLf({...lf,termYears:e.target.value})} style={S.input}>{["10","15","20","25","30"].map(y=><option key={y} value={y}>{y} years</option>)}</select></Field>
          <Field label="Start Date"><input type="date" value={lf.startDate} onChange={e=>setLf({...lf,startDate:e.target.value})} style={S.input} /></Field>
          {lf.principal&&lf.rate&&<div style={{ fontSize:13, color:"#fbbf24", marginBottom:12, ...S.mono }}>Est. {fmt$(mp(lf))}/mo</div>}
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={()=>{if(!lf.name||!lf.principal)return;const nl={...lf,id:uid(),type:"loan"};setLoans(p=>[...p,nl]);setSel(nl.id);setAddingLoan(false);setLf({ name:"", propertyAddress:"", principal:"", rate:"", termYears:"30", startDate:todayStr() });}} style={{ ...S.btn, flex:1 }}>+ Save</button>
            <button onClick={()=>setAddingLoan(false)} style={S.btnGhost}>Cancel</button>
          </div>
        </div>
      )}
      {loan && (
        <>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
            {[["💰","Balance",fmt$(balance),"#f87171","Remaining"],["🧾","This Year Interest",fmt$(yearInt),"#fbbf24","Sch E ✅"],["✅","Total Interest",fmt$(totalInt),"#f59e0b","All time"],["❌","Principal Paid",fmt$(totalPri),"#6b7280","Not deductible"]].map(([ic,lb,vl,cl,sb])=>(
              <div key={lb} style={{ ...S.card, marginBottom:0 }}><div style={{ fontSize:20 }}>{ic}</div><div style={{ fontSize:18, fontWeight:700, color:cl, ...S.mono }}>{vl}</div><div style={{ fontSize:12, fontWeight:600 }}>{lb}</div><div style={{ fontSize:10, color:"#4b5563" }}>{sb}</div></div>
            ))}
          </div>
          <div style={{ background:"#1a1f10", border:"1px solid #f59e0b44", borderRadius:10, padding:"14px 18px", marginBottom:16 }}>
            <div style={{ fontSize:11, color:"#f59e0b", ...S.mono }}>SCHEDULE E DEDUCTION {new Date().getFullYear()}</div>
            <div style={{ fontSize:20, fontWeight:800, color:"#f59e0b", ...S.mono }}>{fmt$(yearInt)}</div>
            <div style={{ fontSize:11, color:"#6b7280" }}>Mortgage interest — deductible on Schedule E</div>
          </div>
          <div style={S.card}>
            <div style={S.section}>LOG PAYMENT — {loan.name}</div>
            <Field label="Date"><input type="date" value={pf.date} onChange={e=>setPf(f=>({...f,date:e.target.value}))} style={S.input} /></Field>
            <Field label="Total Payment ($)"><input type="number" value={pf.totalPayment} onChange={e=>{ const {p,i}=calcSplit(loan,pf.date,e.target.value); setPf(f=>({...f,totalPayment:e.target.value,principal:p,interest:i})); }} style={S.input} /></Field>
            <div style={{ display:"flex", gap:8 }}>
              <Field label="Principal ($)" style={{ flex:1 }}><input type="number" value={pf.principal} onChange={e=>setPf(f=>({...f,principal:e.target.value}))} style={S.input} /></Field>
              <Field label="Interest ($)" style={{ flex:1 }}><input type="number" value={pf.interest} onChange={e=>setPf(f=>({...f,interest:e.target.value}))} style={S.input} /></Field>
            </div>
            <Field label="Escrow ($)"><input type="number" placeholder="0" value={pf.escrow} onChange={e=>setPf(f=>({...f,escrow:e.target.value}))} style={S.input} /></Field>
            {pf.interest&&<div style={{ fontSize:12, padding:"8px 12px", background:"#1e2130", borderRadius:8, marginBottom:12 }}><span style={{ color:"#fbbf24" }}>{fmt$(parseFloat(pf.interest))} interest ✅ Sch E</span><span style={{ color:"#6b7280", marginLeft:12 }}>{fmt$(parseFloat(pf.principal))} principal ❌</span></div>}
            <button onClick={()=>{if(!pf.totalPayment)return;setPayments(p=>[...p,{...pf,id:uid(),loanId:sel,type:"payment"}]);setPf({ date:todayStr(), totalPayment:"", principal:"", interest:"", escrow:"" });}} style={{ ...S.btn, width:"100%" }}>+ Log Payment</button>
          </div>
          {[...lp].reverse().map(p=>(
            <div key={p.id} style={{ ...S.card, marginBottom:8 }}>
              <div style={{ display:"flex", justifyContent:"space-between" }}>
                <div><div style={{ fontSize:15, fontWeight:700, ...S.mono }}>{fmt$(parseFloat(p.totalPayment))}</div><div style={{ fontSize:11, color:"#6b7280", marginTop:3 }}>{fmtDate(p.date)}</div><div style={{ fontSize:11, marginTop:3, display:"flex", gap:8 }}><span style={{ color:"#fbbf24" }}>I: {fmt$(parseFloat(p.interest))}</span><span style={{ color:"#6b7280" }}>P: {fmt$(parseFloat(p.principal))}</span></div></div>
                <button onClick={()=>setPayments(p2=>p2.filter(x=>x.id!==p.id))} style={{ ...S.btnDanger, padding:"6px 10px", fontSize:12 }}>🗑</button>
              </div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

function DocumentsTab({ records, onUpdate }) {
  const [form,setForm] = useState({ date:todayStr(), name:"", category:DOC_CATS[0], notes:"", fileData:null, fileName:"", fileType:"", fileSize:0 });
  const [uploading,setUploading] = useState(false);
  const [preview,setPreview] = useState(null);
  const [search,setSearch] = useState("");
  const fileRef = useRef();

  const handleFile = async (file) => {
    if (!file) return;
    if (file.size > 8*1024*1024) { alert("Max 8MB"); return; }
    setUploading(true);
    try {
      const b64 = await fileToB64(file);
      setForm(f=>({ ...f, fileData:b64, fileName:file.name, fileType:file.type, fileSize:file.size, name:f.name||file.name.replace(/\.[^.]+$/,"") }));
    } catch { alert("Failed to read file"); }
    setUploading(false);
  };

  const save = () => {
    if (!form.name||!form.fileData) { alert("이름과 파일을 추가해 주세요"); return; }
    onUpdate([...records,{...form,id:uid()}]);
    setForm({ date:todayStr(), name:"", category:DOC_CATS[0], notes:"", fileData:null, fileName:"", fileType:"", fileSize:0 });
    if (fileRef.current) fileRef.current.value="";
  };

  const download = (doc) => { const a=document.createElement("a");a.href=doc.fileData;a.download=doc.fileName||doc.name;a.click(); };
  const filtered = records.filter(r=>!search||r.name.toLowerCase().includes(search.toLowerCase())||r.notes?.toLowerCase().includes(search.toLowerCase()));

  return (
    <div>
      <div style={{ fontSize:18, fontWeight:800, marginBottom:16 }}>📁 Documents</div>
      <div style={S.card}>
        <div style={S.section}>UPLOAD</div>
        <Field label="Category"><select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} style={S.input}>{DOC_CATS.map(c=><option key={c}>{c}</option>)}</select></Field>
        <Field label="Name"><input placeholder="Document name" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} style={S.input} /></Field>
        <Field label="Date"><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} style={S.input} /></Field>
        <Field label="Notes"><input placeholder="Notes..." value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} style={S.input} /></Field>
        <label style={S.label}>File</label>

/* ════════════════════════════════════════
   TASKS TAB
════════════════════════════════════════ */
function TasksTab({ tasks, onUpdate }) {
  const [view, setView]   = useState("board"); // board | list | add | edit
  const [editTask, setEditTask] = useState(null);
  const [filterProj, setFilterProj] = useState("All");
  const [form, setForm]   = useState({ title:"", project:"", priority:"Medium", dueDate:"", notes:"", done:false });
  const PC = { High:"#f87171", Medium:"#fbbf24", Low:"#6b7280" };

  const blank = { title:"", project:"", priority:"Medium", dueDate:"", notes:"", done:false };

  const save = () => {
    if (!form.title) return;
    if (editTask) {
      onUpdate(tasks.map(t=>t.id===editTask?{...form,id:editTask}:t));
      setEditTask(null);
    } else {
      onUpdate([...tasks,{...form,id:uid()}]);
    }
    setForm(blank); setView("board");
  };

  const toggle = (id) => onUpdate(tasks.map(t=>t.id===id?{...t,done:!t.done}:t));
  const del    = (id) => { if(confirm("Delete task?")) onUpdate(tasks.filter(t=>t.id!==id)); };

  const today0 = new Date(); today0.setHours(0,0,0,0);
  const isOverdue = (t) => t.dueDate && new Date(t.dueDate+"T00:00:00") < today0;
  const isToday   = (t) => t.dueDate && new Date(t.dueDate+"T00:00:00").getTime() === today0.getTime();

  // Projects with progress
  const allProjects = [...new Set(tasks.map(t=>t.project).filter(Boolean))];
  const projects = allProjects.map(proj => {
    const pts = tasks.filter(t=>t.project===proj);
    const done = pts.filter(t=>t.done).length;
    return { name:proj, total:pts.length, done, pct:pts.length?Math.round(done/pts.length*100):0 };
  });

  const displayed = tasks.filter(t => filterProj==="All" || t.project===filterProj)
    .sort((a,b)=>{
      if (a.done !== b.done) return a.done?1:-1;
      const today0 = new Date(); today0.setHours(0,0,0,0);
      const tomorrow = new Date(today0); tomorrow.setDate(today0.getDate()+1);
      const urgency = (t) => {
        if (!t.dueDate) return 99;
        const d = new Date(t.dueDate+"T00:00:00");
        if (d < today0) return 0;
        if (d.getTime()===today0.getTime()) return 1;
        if (d.getTime()===tomorrow.getTime()) return 2;
        return Math.ceil((d-today0)/(1000*60*60*24))+2;
      };
      const urgA=urgency(a), urgB=urgency(b);
      if (urgA!==urgB) return urgA-urgB;
      const p={High:0,Medium:1,Low:2};
      return (p[a.priority]||1)-(p[b.priority]||1);
    });

  const totalDone = tasks.filter(t=>t.done).length;
  const totalPct  = tasks.length ? Math.round(totalDone/tasks.length*100) : 0;

  // ADD / EDIT FORM
  if (view==="add"||view==="edit") return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:20 }}>
        <button onClick={()=>{setView("board");setForm(blank);setEditTask(null);}} style={{ ...S.btnGhost, padding:"8px 12px" }}>← Back</button>
        <div style={{ fontSize:16, fontWeight:800 }}>{editTask?"Edit Task":"New Task"}</div>
      </div>
      <div style={S.card}>
        <Field label="할일 *"><input autoFocus placeholder="무엇을 해야 하나요?" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} style={S.input} /></Field>
        <Field label="Priority">
          <div style={{ display:"flex", gap:8 }}>
            {["High","Medium","Low"].map(p=>(
              <button key={p} onClick={()=>setForm({...form,priority:p})}
                style={{ flex:1, background:form.priority===p?"#2a2d3a":"#16181f", border:`1px solid ${form.priority===p?PC[p]:"#2a2d3a"}`, color:form.priority===p?PC[p]:"#6b7280", borderRadius:8, padding:"10px 0", fontSize:13, cursor:"pointer", fontFamily:"inherit", fontWeight:600 }}>
                {p}
              </button>
            ))}
          </div>
        </Field>
        <Field label="Project">
          <select value={form.project} onChange={e=>setForm({...form,project:e.target.value})} style={S.input}>
            <option value="">— None —</option>
            {TASK_PROJECTS.map(p=><option key={p}>{p}</option>)}
          </select>
        </Field>
        <Field label="Due Date"><input type="date" value={form.dueDate} onChange={e=>setForm({...form,dueDate:e.target.value})} style={S.input} /></Field>
        <Field label="Notes"><input placeholder="추가 메모" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} style={S.input} /></Field>
        {editTask && (
          <Field label="Status">
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={()=>setForm({...form,done:false})} style={{ flex:1, background:!form.done?"#2a2d3a":"#16181f", border:`1px solid ${!form.done?"#6ee7b7":"#2a2d3a"}`, color:!form.done?"#6ee7b7":"#6b7280", borderRadius:8, padding:"10px 0", fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>⬜ Pending</button>
              <button onClick={()=>setForm({...form,done:true})}  style={{ flex:1, background:form.done?"#2a2d3a":"#16181f", border:`1px solid ${form.done?"#6ee7b7":"#2a2d3a"}`, color:form.done?"#6ee7b7":"#6b7280", borderRadius:8, padding:"10px 0", fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>✅ Done</button>
            </div>
          </Field>
        )}
        <div style={{ display:"flex", gap:8 }}>
          <button onClick={save} style={{ ...S.btn, flex:1 }}>{editTask?"✅ Save":"+ Add Task"}</button>
          {editTask && <button onClick={()=>del(editTask)} style={S.btnDanger}>🗑</button>}
        </div>
      </div>
    </div>
  );

  // MAIN BOARD
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <div style={{ fontSize:18, fontWeight:800 }}>📋 Tasks</div>
        <button onClick={()=>{setForm(blank);setEditTask(null);setView("add");}} style={{ ...S.btn, padding:"8px 16px", fontSize:13 }}>+ Add</button>
      </div>

      {/* Overall progress */}
      <div style={{ ...S.card, marginBottom:16 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
          <div style={{ fontSize:14, fontWeight:700 }}>전체 진행률</div>
          <div style={{ fontSize:22, fontWeight:800, color:"#6ee7b7", ...S.mono }}>{totalPct}%</div>
        </div>
        <div style={{ height:10, background:"#1e2130", borderRadius:5, overflow:"hidden", marginBottom:8 }}>
          <div style={{ width:`${totalPct}%`, height:"100%", background:`linear-gradient(90deg, #6ee7b7, #3b82f6)`, borderRadius:5, transition:"width 0.4s" }} />
        </div>
        <div style={{ fontSize:12, color:"#6b7280" }}>{totalDone}/{tasks.length} 완료 · {tasks.filter(t=>!t.done).length}개 남음</div>
      </div>

      {/* Project progress */}
      {projects.length > 0 && (
        <div style={{ ...S.card, marginBottom:16 }}>
          <div style={S.section}>프로젝트별 공정률</div>
          {projects.map(p=>(
            <div key={p.name} style={{ marginBottom:14 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:5 }}>
                <div style={{ fontSize:13, fontWeight:600 }}>{p.name}</div>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ fontSize:11, color:"#6b7280" }}>{p.done}/{p.total}</span>
                  <span style={{ fontSize:14, fontWeight:800, color: p.pct===100?"#6ee7b7":p.pct>=50?"#fbbf24":"#f87171", ...S.mono }}>{p.pct}%</span>
                </div>
              </div>
              <div style={{ height:7, background:"#1e2130", borderRadius:4, overflow:"hidden" }}>
                <div style={{ width:`${p.pct}%`, height:"100%", background: p.pct===100?"#6ee7b7":p.pct>=50?"#fbbf24":"#f87171", borderRadius:4, transition:"width 0.4s" }} />
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Filter by project */}
      <div style={{ display:"flex", gap:6, overflowX:"auto", marginBottom:14, paddingBottom:4 }}>
        {["All",...allProjects].map(p=>(
          <button key={p} onClick={()=>setFilterProj(p)}
            style={{ ...S.btnGhost, whiteSpace:"nowrap", background:filterProj===p?"#2a2d3a":"#16181f", color:filterProj===p?"#e8e8f0":"#6b7280", fontSize:12, padding:"6px 14px", flexShrink:0 }}>
            {p}
          </button>
        ))}
      </div>

      {/* Task list */}
      {displayed.length===0 && <div style={{ textAlign:"center", padding:"40px 0", color:"#4b5563" }}><div style={{ fontSize:40, marginBottom:8 }}>🎉</div>할일 없음!</div>}
      {displayed.map(t=>{
        const od=isOverdue(t), td=isToday(t);
        return (
          <div key={t.id} style={{ ...S.card, marginBottom:8, padding:"12px 16px", borderLeft:`3px solid ${t.done?"#2a2d3a":od?"#f87171":td?"#fbbf24":PC[t.priority]||"#6b7280"}`, opacity:t.done?0.55:1 }}>
            <div style={{ display:"flex", alignItems:"center", gap:12 }}>
              {/* 체크박스만 완료 처리 */}
              <div onClick={()=>toggle(t.id)}
                style={{ width:24, height:24, borderRadius:"50%", border:`2px solid ${t.done?"#6ee7b7":PC[t.priority]||"#6b7280"}`, background:t.done?"#6ee7b7":"transparent", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", flexShrink:0 }}>
                {t.done && <span style={{ fontSize:12, color:"#0f1117", fontWeight:800 }}>✓</span>}
              </div>
              {/* 나머지 영역 탭하면 편집 */}
              <div style={{ flex:1, minWidth:0, cursor:"pointer" }} onClick={()=>{setForm(t);setEditTask(t.id);setView("edit");}}>
                <div style={{ fontSize:13, fontWeight:600, textDecoration:t.done?"line-through":"none", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{t.title}</div>
                <div style={{ fontSize:11, color:"#4b5563", marginTop:3, display:"flex", gap:6, flexWrap:"wrap" }}>
                  {t.project && <Badge color="#60a5fa">{t.project}</Badge>}
                  {t.dueDate && <span style={{ color:t.done?"#4b5563":od?"#f87171":td?"#fbbf24":"#6b7280" }}>{od?"🚨":td?"⚠️":"📅"} {fmtDate(t.dueDate)}</span>}
                  {t.notes && <span style={{ color:"#4b5563" }}>💬 {t.notes}</span>}
                </div>
              </div>
              <Badge color={t.done?"#2a2d3a":PC[t.priority]||"#6b7280"}>{t.done?"Done":t.priority}</Badge>
            </div>
          </div>
        );
      })}
    </div>
  );
}


function SettingsTab({ customCats, onUpdate }) {
  const [form, setForm] = useState({ name:"", schedule:"C" });
  const add = () => {
    if (!form.name.trim()) return;
    onUpdate([...customCats, { name:form.name.trim(), schedule:form.schedule }]);
    setForm({ name:"", schedule:"C" });
  };
  return (
    <div>
      <div style={{ fontSize:18, fontWeight:800, marginBottom:4 }}>⚙️ Settings</div>
      <div style={{ fontSize:13, color:"#6b7280", marginBottom:20 }}>지출 카테고리 커스터마이즈</div>
      <div style={S.card}>
        <div style={S.section}>기본 카테고리</div>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
          {DEFAULT_EXPENSE_CATS.map(c=>(
            <span key={c.name} style={{ background:c.schedule==="E"?"#f59e0b22":"#6ee7b722", color:c.schedule==="E"?"#f59e0b":"#6ee7b7", border:`1px solid ${c.schedule==="E"?"#f59e0b44":"#6ee7b744"}`, borderRadius:8, padding:"6px 12px", fontSize:12 }}>
              {c.name} <span style={{ fontSize:10, opacity:0.6 }}>Sch {c.schedule}</span>
            </span>
          ))}
        </div>
      </div>
      <div style={S.card}>
        <div style={S.section}>내가 추가한 카테고리</div>
        {customCats.length===0 && <div style={{ fontSize:13, color:"#4b5563", marginBottom:14 }}>아직 없어요</div>}
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:customCats.length?16:0 }}>
          {customCats.map((c,i)=>(
            <div key={i} style={{ display:"flex", alignItems:"center", gap:6, background:c.schedule==="E"?"#f59e0b22":"#6ee7b722", border:`1px solid ${c.schedule==="E"?"#f59e0b44":"#6ee7b744"}`, borderRadius:8, padding:"6px 12px" }}>
              <span style={{ fontSize:12, color:c.schedule==="E"?"#f59e0b":"#6ee7b7" }}>{c.name} <span style={{ fontSize:10, opacity:0.6 }}>Sch {c.schedule}</span></span>
              <button onClick={()=>onUpdate(customCats.filter((_,j)=>j!==i))} style={{ background:"none", border:"none", color:"#f87171", cursor:"pointer", fontSize:16, padding:0, lineHeight:1 }}>×</button>
            </div>
          ))}
        </div>
        <div style={S.section}>새 카테고리 추가</div>
        <Field label="이름"><input placeholder="예: 🏡 Property Tax" value={form.name} onChange={e=>setForm({...form,name:e.target.value}) } style={S.input} /></Field>
        <Field label="세금 구분">
          <div style={{ display:"flex", gap:8 }}>
            {[["E","Sch E · Rental","#f59e0b"],["C","Sch C · Business","#6ee7b7"]].map(([s,label,color])=>(
              <button key={s} onClick={()=>setForm({...form,schedule:s})}
                style={{ flex:1, background:form.schedule===s?"#2a2d3a":"#16181f", border:`1px solid ${form.schedule===s?color:"#2a2d3a"}`, color:form.schedule===s?color:"#6b7280", borderRadius:8, padding:"10px 0", fontSize:13, cursor:"pointer", fontFamily:"inherit", fontWeight:600 }}>
                {label}
              </button>
            ))}
          </div>
        </Field>
        <button onClick={add} style={{ ...S.btn, width:"100%" }}>+ Add Category</button>
      </div>
    </div>
  );
}

function ReportsTab({ fi, month, totalIn, totalEx, netProfit, totalMi, miDeduct, totalHr }) {
  const schC = fi.expenses.filter(r=>getTax(r.category)==="C").reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const schE = fi.expenses.filter(r=>getTax(r.category)==="E").reduce((s,r)=>s+(parseFloat(r.amount)||0),0);

  const exportTax = () => {
    const e=fi.expenses;
    const lines=[
      `TAX REPORT — ${month}`,"",
      "=== SCHEDULE E (Rental/Airbnb) ===","Date,Category,Description,Amount",
      ...e.filter(r=>getTax(r.category)==="E").map(r=>[r.date,r.category,r.description,r.amount].join(",")),
      `Sch E Total,$${schE.toFixed(2)}`,"",
      "=== SCHEDULE C (Business/Inspection) ===","Date,Category,Description,Amount",
      ...e.filter(r=>getTax(r.category)==="C").map(r=>[r.date,r.category,r.description,r.amount].join(",")),
      `Sch C Total,$${schC.toFixed(2)}`,"",
      "=== MILEAGE ===","Date,From,To,Miles,Deduction,Purpose",
      ...fi.mileage.map(r=>[r.date,r.from,r.to,r.miles,((parseFloat(r.miles)||0)*IRS_MILEAGE_RATE).toFixed(2),r.purpose].join(",")),
      `Total Miles,${totalMi.toFixed(1)}`,`Deduction,$${miDeduct.toFixed(2)}`,"",
      "=== INCOME ===","Date,Category,Description,Amount",
      ...fi.income.map(r=>[r.date,r.category,r.description,r.amount].join(",")),
      `Total Income,$${totalIn.toFixed(2)}`,
    ];
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));a.download=`TAX_${month}.csv`;a.click();
  };

  const groups=EXPENSE_GROUPS.map(g=>({ ...g, total:fi.expenses.filter(r=>r.category.startsWith(g.prefix)).reduce((s,r)=>s+(parseFloat(r.amount)||0),0) })).filter(g=>g.total>0);

  return (
    <div>
      <div style={{ fontSize:18, fontWeight:800, marginBottom:16 }}>📥 Reports</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
        {[["💰","Income",fmt$(totalIn),"#6ee7b7"],["💸","Expenses",fmt$(totalEx),"#f87171"],["📊","Net Profit",fmt$(netProfit),netProfit>=0?"#60a5fa":"#f87171"],["🚗","Mileage Ded.",fmt$(miDeduct),"#fbbf24"]].map(([ic,lb,vl,cl])=>(
          <div key={lb} style={{ ...S.card, marginBottom:0 }}><div style={{ fontSize:20 }}>{ic}</div><div style={{ fontSize:18, fontWeight:700, color:cl, ...S.mono }}>{vl}</div><div style={{ fontSize:12, fontWeight:600 }}>{lb}</div></div>
        ))}
      </div>
      <div style={S.card}>
        <div style={S.section}>TAX SPLIT</div>
        <div style={{ display:"flex", gap:10, marginBottom:16 }}>
          <div style={{ flex:1, background:"#1a1f10", border:"1px solid #f59e0b33", borderRadius:10, padding:14 }}><div style={{ fontSize:10, color:"#f59e0b", ...S.mono }}>SCHEDULE E</div><div style={{ fontSize:20, fontWeight:800, color:"#f59e0b", ...S.mono }}>{fmt$(schE)}</div><div style={{ fontSize:11, color:"#6b7280" }}>Cabin/Airbnb</div></div>
          <div style={{ flex:1, background:"#0f1a14", border:"1px solid #6ee7b733", borderRadius:10, padding:14 }}><div style={{ fontSize:10, color:"#6ee7b7", ...S.mono }}>SCHEDULE C</div><div style={{ fontSize:20, fontWeight:800, color:"#6ee7b7", ...S.mono }}>{fmt$(schC)}</div><div style={{ fontSize:11, color:"#6b7280" }}>Inspection/Biz</div></div>
        </div>
        {groups.map(g=>(
          <div key={g.label} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <div style={{ fontSize:13 }}>{g.label}</div>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ width:80, height:5, background:"#1e2130", borderRadius:3, overflow:"hidden" }}><div style={{ width:`${Math.min(100,(g.total/totalEx)*100)}%`, height:"100%", background:g.color, borderRadius:3 }} /></div>
              <div style={{ fontSize:13, color:g.color, ...S.mono, minWidth:70, textAlign:"right" }}>{fmt$(g.total)}</div>
            </div>
          </div>
        ))}
      </div>
      <div style={S.card}>
        <div style={S.section}>EXPORT</div>
        <button onClick={exportTax} style={{ ...S.btn, width:"100%", marginBottom:10, background:"linear-gradient(135deg,#f59e0b,#ef4444)", color:"#fff" }}>🧾 Tax-Ready CSV (Sch C + E)</button>
        <div style={{ fontSize:12, color:"#4b5563", marginTop:8 }}>💡 Schedule C / E 분리 — 회계사 바로 전달 가능</div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
